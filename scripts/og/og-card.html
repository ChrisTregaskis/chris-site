<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      /* The Drawing office look: drafting paper, graphite ink, one red pen. */
      @font-face {
        font-family: "Newsreader";
        src: url(../../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2)
          format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url(../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2)
          format("woff2");
        font-weight: 400 700;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f2f4f4;
        color: #1a2023;
        font-family: "Instrument Sans", sans-serif;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .top svg {
        width: 56px;
        height: 56px;
      }
      .name {
        font-size: 28px;
        font-weight: 600;
      }
      .role {
        font-size: 21px;
        color: #4a5357;
        margin-top: 2px;
      }
      h1 {
        margin: 0;
        font-family: "Newsreader", serif;
        font-weight: 400;
        font-size: 74px;
        line-height: 1.02;
        letter-spacing: -0.022em;
        max-width: 1040px;
      }
      h1 em {
        font-style: normal;
        color: #bf3a1e;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-top: 24px;
        border-top: 1px solid rgba(26, 32, 35, 0.2);
      }
      .tags {
        display: flex;
        gap: 32px;
        font-size: 22px;
        color: #4a5357;
      }
      .url {
        font-size: 24px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="3" fill="#BF3A1E" />
          <g
            transform="translate(1.5 0)"
            fill="none"
            stroke="#F2F4F4"
            stroke-width="4"
          >
            <path d="M14 7.5 A8.5 8.5 0 1 0 18.25 23.36" />
            <path d="M13 7.5 H27.5 M23 7.5 V26.75" stroke-linecap="butt" />
          </g>
        </svg>
        <div>
          <div class="name">Chris Tregaskis</div>
          <div class="role">Senior full-stack TypeScript developer</div>
        </div>
      </div>
      <h1>
        I build whole products, end to end,
        <em>built properly and shipped quickly</em> with AI in the workflow.
      </h1>
      <div class="foot">
        <div class="tags">
          <span class="tag">Front end</span><span class="tag">Back end</span
          ><span class="tag">AI agents</span><span class="tag">Cloud</span>
        </div>
        <div class="url">chris-tregaskis.uk</div>
      </div>
    </div>
  </body>
</html>
